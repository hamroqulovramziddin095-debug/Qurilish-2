<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qurilish Nazorati</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
}

.header {
    max-width: 1500px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logout {
    border: 0;
    background: #dc2626;
    color: white;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.container {
    max-width: 1500px;
    margin: 20px auto;
    padding: 0 15px;
}

/* LOGIN */

.login {
    max-width: 420px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,.1);
}

.login h2 {
    text-align: center;
    margin-top: 0;
}

.login input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

.login button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

.login-btn {
    background: #2563eb;
}

.register-btn {
    background: #16a34a;
}

#loginMessage {
    text-align: center;
    margin-top: 12px;
}

/* BLOCKS */

.blocks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
}

.block-button {
    background: white;
    border: 0;
    border-radius: 8px;
    padding: 13px 8px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,.08);
}

.block-button:hover {
    background: #e5e7eb;
}

.block-button.active {
    background: #2563eb;
    color: white;
}

/* CARD */

.card {
    background: white;
    border-radius: 13px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.card-header h2 {
    margin: 0;
}

.badge {
    padding: 7px 12px;
    border-radius: 20px;
    color: white;
    font-size: 13px;
}

.admin {
    background: #16a34a;
}

.viewer {
    background: #64748b;
}

/* AVERAGE */

.average {
    background: #f1f5f9;
    padding: 15px;
    border-radius: 9px;
    margin-bottom: 15px;
}

.average strong {
    font-size: 26px;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 1050px;
    border-collapse: collapse;
}

th {
    background: #1f2937;
    color: white;
    padding: 12px;
    text-align: left;
    white-space: nowrap;
}

td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
}

tr:hover {
    background: #f8fafc;
}

input.edit {
    width: 100%;
    min-width: 80px;
    padding: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

/* PROGRESS */

.progress {
    width: 160px;
}

.progress-bar {
    height: 10px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #2563eb;
    transition: .3s;
}

.percent {
    font-weight: bold;
    margin-top: 5px;
}

/* STATUS */

.done {
    color: #16a34a;
    font-weight: bold;
}

.process {
    color: #d97706;
    font-weight: bold;
}

.not-started {
    color: #64748b;
    font-weight: bold;
}

.save {
    background: #2563eb;
    border: 0;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.save:hover {
    background: #1d4ed8;
}

.empty,
.loading {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

.notice {
    background: #eff6ff;
    color: #1d4ed8;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

@media(max-width:700px) {

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .user-area {
        width: 100%;
        justify-content: space-between;
    }

    .container {
        padding: 0 8px;
    }

    .card {
        padding: 12px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login">

    <h2>🏗️ Qurilish Nazorati</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Parol"
    >

    <button
        class="login-btn"
        onclick="login()"
    >
        Kirish
    </button>

    <button
        class="register-btn"
        onclick="register()"
    >
        Ro'yxatdan o'tish
    </button>

    <div id="loginMessage"></div>

</div>


<!-- APP -->

<div id="app" style="display:none;">

<header>

    <div class="header">

        <div class="logo">
            🏗️ Qurilish Nazorati
        </div>

        <div class="user-area">

            <span id="userEmail"></span>

            <button
                class="logout"
                onclick="logout()"
            >
                Chiqish
            </button>

        </div>

    </div>

</header>


<div class="container">

    <!-- 1-17 BLOCK -->

    <div
        id="blocks"
        class="blocks"
    ></div>


    <div class="card">

        <div class="card-header">

            <h2 id="blockTitle">
                1-blok
            </h2>

            <span
                id="roleBadge"
                class="badge"
            ></span>

        </div>


        <div id="notice"></div>


        <div class="average">

            Umumiy bajarilish:

            <br>

            <strong id="average">
                0%
            </strong>

        </div>


        <div
            id="workList"
            class="table-wrap"
        >

            <div class="loading">
                Yuklanmoqda...
            </div>

        </div>

    </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://fbjfjphvealwxaveoeyx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cpoQQu4uJ8KHE-wNHA7gbA_AJbHME__";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
    "hamroqulovramziddin095@gmail.com";


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let isAdmin = false;

let currentBlock = 1;

let realtimeChannel = null;


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.textContent =
            "Email va parolni kiriting.";

        return;
    }


    message.textContent =
        "Kirilmoqda...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if (error) {

        message.textContent =
            error.message;

        return;
    }


    currentUser =
        data.user;

    await startApp();
}


/* =====================================================
   REGISTER
===================================================== */

async function register() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");


    if (!email || !password) {

        message.textContent =
            "Email va parolni kiriting.";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Parol kamida 6 ta belgi bo'lishi kerak.";

        return;
    }


    message.textContent =
        "Ro'yxatdan o'tkazilmoqda...";


    const {
        error
    } =
        await supabaseClient.auth.signUp({
            email,
            password
        });


    if (error) {

        message.textContent =
            error.message;

        return;
    }


    message.textContent =
        "Emailingizni tasdiqlang.";
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    await supabaseClient.auth.signOut();

    if (realtimeChannel) {

        await supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }

    location.reload();
}


/* =====================================================
   START APP
===================================================== */

async function startApp() {

    if (!currentUser)
        return;


    isAdmin =
        currentUser.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase();


    document.getElementById("loginPage")
        .style.display = "none";


    document.getElementById("app")
        .style.display = "block";


    document.getElementById("userEmail")
        .textContent =
        currentUser.email;


    updateRole();

    createBlocks();

    await showBlock(1);

    startRealtime();
}


/* =====================================================
   ROLE
===================================================== */

function updateRole() {

    const badge =
        document.getElementById("roleBadge");

    const notice =
        document.getElementById("notice");


    if (isAdmin) {

        badge.textContent =
            "ADMIN";

        badge.className =
            "badge admin";


        notice.innerHTML =
            `
            <div class="notice">
                Siz admin sifatida kirdingiz.
                Barcha blok ma'lumotlarini o'zgartirishingiz mumkin.
            </div>
            `;

    } else {

        badge.textContent =
            "KO'RUVCHI";

        badge.className =
            "badge viewer";


        notice.innerHTML =
            `
            <div class="notice">
                Siz faqat ma'lumotlarni ko'rishingiz mumkin.
            </div>
            `;
    }
}


/* =====================================================
   CREATE 1-17 BLOCKS
===================================================== */

function createBlocks() {

    const container =
        document.getElementById("blocks");

    container.innerHTML = "";


    for (
        let block = 1;
        block <= 17;
        block++
    ) {

        const button =
            document.createElement("button");


        button.className =
            "block-button";


        button.textContent =
            block + "-blok";


        button.dataset.block =
            block;


        button.onclick =
            function() {

                showBlock(block);

            };


        container.appendChild(button);
    }
}


/* =====================================================
   ACTIVE BLOCK
===================================================== */

function setActiveBlock(block) {

    document
        .querySelectorAll(".block-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );


            if (
                Number(button.dataset.block) ===
                block
            ) {

                button.classList.add(
                    "active"
                );

            }

        });
}


/* =====================================================
   SHOW BLOCK
===================================================== */

async function showBlock(block) {

    currentBlock =
        block;


    setActiveBlock(block);


    document.getElementById("blockTitle")
        .textContent =
        block + "-blok";


    const list =
        document.getElementById(
            "workList"
        );


    list.innerHTML =
        `
        <div class="loading">
            ${block}-blok yuklanmoqda...
        </div>
        `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("construction_items")
            .select("*")
            .eq("block_id", block)
            .order(
                "id",
                {
                    ascending: true
                }
            );


    if (error) {

        list.innerHTML =
            `
            <div class="empty">
                Xatolik: ${escapeHtml(error.message)}
            </div>
            `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            `
            <div class="empty">
                ${block}-blokda ma'lumot yo'q.
            </div>
            `;

        document.getElementById(
            "average"
        ).textContent = "0%";

        return;
    }


    renderTable(data);
}


/* =====================================================
   TABLE
===================================================== */

function renderTable(items) {

    const list =
        document.getElementById(
            "workList"
        );


    /*
       FAQAT 17-BLOKDA
       MATERIAL VA BIRLIK
       KO'RUVCHIDAN YASHIRILADI
    */

    const hideColumns =
        currentBlock === 17 &&
        !isAdmin;


    let html = `

    <table>

        <thead>

            <tr>

                <th>#</th>

                ${
                    !hideColumns
                    ? "<th>Material / uskuna</th>"
                    : ""
                }

                <th>Reja</th>

                <th>Sarflangan</th>

                ${
                    !hideColumns
                    ? "<th>Birlik</th>"
                    : ""
                }

                <th>1 birlik narxi</th>

                <th>Jami summa</th>

                <th>Foiz</th>

                <th>Status</th>

                ${
                    isAdmin
                    ? "<th>Saqlash</th>"
                    : ""
                }

            </tr>

        </thead>

        <tbody>
    `;


    let totalPercent = 0;


    items.forEach(
        (item, index) => {


            const planned =
                Number(item.planned) || 0;


            const used =
                Number(item.used) || 0;


            const price =
                Number(item.price) || 0;


            let percent =
                planned > 0
                ? (used / planned) * 100
                : 0;


            if (percent > 100)
                percent = 100;


            if (percent < 0)
                percent = 0;


            totalPercent +=
                percent;


            const total =
                used * price;


            let status =
                "Boshlanmagan";


            let statusClass =
                "not-started";


            if (percent >= 100) {

                status =
                    "✓ Tugagan";

                statusClass =
                    "done";

            }

            else if (percent > 0) {

                status =
                    "Jarayonda";

                statusClass =
                    "process";

            }


            html += `

            <tr>

                <td>
                    ${index + 1}
                </td>
            `;


            /* MATERIAL */

            if (!hideColumns) {

                html += `

                <td>

                    ${
                        isAdmin

                        ?

                        `
                        <input
                            class="edit"
                            id="material-${item.id}"
                            value="${safeAttribute(
                                item.material ||
                                item.name ||
                                ""
                            )}"
                        >
                        `

                        :

                        `
                        <b>
                            ${escapeHtml(
                                item.name || ""
                            )}
                        </b>

                        ${
                            item.material
                            ?
                            `
                            <div style="
                                font-size:12px;
                                color:#64748b;
                                margin-top:3px;
                            ">
                                ${escapeHtml(
                                    item.material
                                )}
                            </div>
                            `
                            :
                            ""
                        }
                        `
                    }

                </td>

                `;

            }


            /* REJA */

            html += `

            <td>

                ${
                    isAdmin

                    ?

                    `
                    <input
                        class="edit"
                        type="number"
                        min="0"
                        id="planned-${item.id}"
                        value="${planned}"
                    >
                    `

                    :

                    formatNumber(planned)
                }

            </td>


            <!-- SARFLANGAN -->

            <td>

                ${
                    isAdmin

                    ?

                    `
                    <input
                        class="edit"
                        type="number"
                        min="0"
                        id="used-${item.id}"
                        value="${used}"
                        oninput="preview(${item.id})"
                    >
                    `

                    :

                    formatNumber(used)
                }

            </td>
            `;


            /* BIRLIK */

            if (!hideColumns) {

                html += `

                <td>

                    ${
                        isAdmin

                        ?

                        `
                        <input
                            class="edit"
                            id="unit-${item.id}"
                            value="${safeAttribute(
                                item.unit || ""
                            )}"
                        >
                        `

                        :

                        escapeHtml(
                            item.unit || ""
                        )
                    }

                </td>

                `;

            }


            /* PRICE */

            html += `

            <td>

                ${
                    isAdmin

                    ?

                    `
                    <input
                        class="edit"
                        type="number"
                        min="0"
                        id="price-${item.id}"
                        value="${price}"
                        oninput="preview(${item.id})"
                    >
                    `

                    :

                    formatMoney(price)
                }

            </td>


            <!-- TOTAL -->

            <td id="total-${item.id}">

                ${formatMoney(total)}

            </td>


            <!-- PROGRESS -->

            <td>

                <div class="progress">

                    <div class="progress-bar">

                        <div
                            id="bar-${item.id}"
                            class="progress-fill"
                            style="
                                width:${percent}%;
                            "
                        ></div>

                    </div>

                    <div
                        id="percent-${item.id}"
                        class="percent"
                    >
                        ${percent.toFixed(1)}%
                    </div>

                </div>

            </td>


            <!-- STATUS -->

            <td>

                <span
                    id="status-${item.id}"
                    class="${statusClass}"
                >
                    ${status}
                </span>

            </td>
            `;


            /* SAVE */

            if (isAdmin) {

                html += `

                <td>

                    <button
                        class="save"
                        onclick="saveItem(${item.id})"
                    >
                        Saqlash
                    </button>

                </td>

                `;

            }


            html += `

            </tr>

            `;

        }
    );


    html += `

        </tbody>

    </table>

    `;


    list.innerHTML =
        html;


    const average =
        items.length
        ? totalPercent / items.length
        : 0;


    document.getElementById(
        "average"
    ).textContent =
        average.toFixed(1) + "%";
}


/* =====================================================
   PREVIEW
===================================================== */

function preview(id) {

    const plannedInput =
        document.getElementById(
            "planned-" + id
        );


    const usedInput =
        document.getElementById(
            "used-" + id
        );


    const priceInput =
        document.getElementById(
            "price-" + id
        );


    if (!plannedInput ||
        !usedInput)
        return;


    const planned =
        Number(
            plannedInput.value
        ) || 0;


    const used =
        Number(
            usedInput.value
        ) || 0;


    const price =
        Number(
            priceInput?.value
        ) || 0;


    let percent =
        planned > 0
        ? (used / planned) * 100
        : 0;


    if (percent > 100)
        percent = 100;


    if (percent < 0)
        percent = 0;


    const total =
        used * price;


    const bar =
        document.getElementById(
            "bar-" + id
        );


    const percentText =
        document.getElementById(
            "percent-" + id
        );


    const totalText =
        document.getElementById(
            "total-" + id
        );


    const status =
        document.getElementById(
            "status-" + id
        );


    if (bar)
        bar.style.width =
            percent + "%";


    if (percentText)
        percentText.textContent =
            percent.toFixed(1) + "%";


    if (totalText)
        totalText.textContent =
            formatMoney(total);


    if (status) {

        if (percent >= 100) {

            status.textContent =
                "✓ Tugagan";

            status.className =
                "done";

        }

        else if (percent > 0) {

            status.textContent =
                "Jarayonda";

            status.className =
                "process";

        }

        else {

            status.textContent =
                "Boshlanmagan";

            status.className =
                "not-started";

        }

    }
}


/* =====================================================
   SAVE
===================================================== */

async function saveItem(id) {

    if (!isAdmin) {

        alert(
            "Sizda o'zgartirish huquqi yo'q."
        );

        return;
    }


    const material =
        document.getElementById(
            "material-" + id
        );


    const planned =
        document.getElementById(
            "planned-" + id
        );


    const used =
        document.getElementById(
            "used-" + id
        );


    const unit =
        document.getElementById(
            "unit-" + id
        );


    const price =
        document.getElementById(
            "price-" + id
        );


    const updateData = {

        planned:
            Number(
                planned?.value
            ) || 0,

        used:
            Number(
                used?.value
            ) || 0,

        price:
            Number(
                price?.value
            ) || 0

    };


    if (material) {

        updateData.material =
            material.value;

    }


    if (unit) {

        updateData.unit =
            unit.value;

    }


    const {
        error
    } =
        await supabaseClient
            .from(
                "construction_items"
            )
            .update(updateData)
            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "Xatolik:\n" +
            error.message
        );

        return;
    }


    alert(
        "Saqlandi ✅"
    );


    await showBlock(
        currentBlock
    );
}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime() {

    realtimeChannel =
        supabaseClient
            .channel(
                "construction-items"
            )

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "construction_items"
                },
                function() {

                    showBlock(
                        currentBlock
                    );

                }
            )

            .subscribe();
}


/* =====================================================
   FORMAT
===================================================== */

function formatNumber(number) {

    return Number(
        number || 0
    ).toLocaleString(
        "uz-UZ"
    );
}


function formatMoney(number) {

    return Number(
        number || 0
    ).toLocaleString(
        "uz-UZ"
    ) + " so'm";
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function safeAttribute(value) {

    return escapeHtml(value);
}


/* =====================================================
   SESSION
===================================================== */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if (data.session) {

        currentUser =
            data.session.user;

        await startApp();

    }
}


checkSession();


/* =====================================================
   AUTH CHANGE
===================================================== */

supabaseClient.auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            if (
