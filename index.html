<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qurilish Nazorati</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 18px;
}

.header-inner {
    max-width: 1400px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 15px;
}

/* LOGIN */

.login-box {
    width: 100%;
    max-width: 420px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.login-box h2 {
    margin-top: 0;
    text-align: center;
}

input,
button {
    font-family: inherit;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.login-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

.register-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #16a34a;
    color: white;
    cursor: pointer;
    margin-top: 8px;
}

.message {
    margin-top: 12px;
    text-align: center;
}

/* USER */

.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logout {
    background: #dc2626;
    color: white;
    border: 0;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

/* BLOCKS */

.blocks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
}

.block-button {
    border: 0;
    background: white;
    padding: 12px 8px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,.08);
    font-weight: bold;
}

.block-button:hover {
    background: #e5e7eb;
}

.block-button.active {
    background: #2563eb;
    color: white;
}

/* CARD */

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.card-top h2 {
    margin: 0;
}

.admin-badge {
    background: #16a34a;
    color: white;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.viewer-badge {
    background: #64748b;
    color: white;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
}

/* AVERAGE */

.average-box {
    margin-bottom: 15px;
    background: #f1f5f9;
    padding: 14px;
    border-radius: 10px;
}

.average-number {
    font-size: 25px;
    font-weight: bold;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
}

th {
    background: #1f2937;
    color: white;
    padding: 12px;
    text-align: left;
    white-space: nowrap;
}

td {
    border-bottom: 1px solid #e5e7eb;
    padding: 10px;
    vertical-align: middle;
}

tr:hover {
    background: #f8fafc;
}

.edit-input {
    width: 100%;
    min-width: 80px;
    padding: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
}

.task-name {
    font-weight: bold;
}

.material-name {
    color: #64748b;
    font-size: 12px;
    margin-top: 3px;
}

/* PROGRESS */

.progress-container {
    min-width: 150px;
}

.progress-bar {
    height: 10px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    transition: width .3s;
}

.progress-text {
    margin-top: 5px;
    font-weight: bold;
    font-size: 13px;
}

/* STATUS */

.status {
    font-weight: bold;
    white-space: nowrap;
}

.status.done {
    color: #16a34a;
}

.status.process {
    color: #d97706;
}

.status.not-started {
    color: #64748b;
}

/* SAVE */

.save-btn {
    border: 0;
    background: #2563eb;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.save-btn:hover {
    background: #1d4ed8;
}

.loading {
    text-align: center;
    padding: 30px;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

/* ADMIN NOTICE */

.notice {
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #eff6ff;
    color: #1d4ed8;
}

/* MOBILE */

@media(max-width: 700px) {

    .header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    h1 {
        font-size: 20px;
    }

    .user-info {
        width: 100%;
        justify-content: space-between;
    }

    .container {
        padding: 0 8px;
    }

    .card {
        padding: 12px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-box">

    <h2>🏗️ Qurilish Nazorati</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Parol"
    >

    <button class="login-btn" onclick="login()">
        Kirish
    </button>

    <button class="register-btn" onclick="register()">
        Ro'yxatdan o'tish
    </button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- APP -->

<div id="app" style="display:none;">

<header>

    <div class="header-inner">

        <h1>🏗️ Qurilish Nazorati</h1>

        <div class="user-info">

            <span id="userEmail"></span>

            <button class="logout" onclick="logout()">
                Chiqish
            </button>

        </div>

    </div>

</header>


<div class="container">

    <!-- BLOCKS -->

    <div id="blocks" class="blocks"></div>


    <!-- MAIN CARD -->

    <div class="card">

        <div class="card-top">

            <h2 id="blockTitle">
                1-blok
            </h2>

            <span id="roleBadge"></span>

        </div>


        <div id="notice"></div>


        <div class="average-box">

            <div>
                Umumiy bajarilish:
            </div>

            <div
                id="average"
                class="average-number"
            >
                0%
            </div>

        </div>


        <div
            id="workList"
            class="table-wrapper"
        >

            <div class="loading">
                Yuklanmoqda...
            </div>

        </div>

    </div>

</div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://fbjfjphvealwxaveoeyx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cpoQQu4uJ8KHE-wNHA7gbA_AJbHME__";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// ADMIN
// =====================================================

const ADMIN_EMAIL =
    "hamroqulovramziddin095@gmail.com";


// =====================================================
// VARIABLES
// =====================================================

let currentUser = null;

let isAdmin = false;

let currentBlock = 1;

let realtimeChannel = null;


// =====================================================
// LOGIN
// =====================================================

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if (!email || !password) {

        message.textContent =
            "Email va parolni kiriting.";

        return;
    }

    message.textContent =
        "Kirish...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        message.textContent =
            error.message;

        return;
    }

    currentUser = data.user;

    await startApp();

}


// =====================================================
// REGISTER
// =====================================================

async function register() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if (!email || !password) {

        message.textContent =
            "Email va parolni kiriting.";

        return;
    }

    if (password.length < 6) {

        message.textContent =
            "Parol kamida 6 ta belgidan iborat bo'lishi kerak.";

        return;
    }

    message.textContent =
        "Ro'yxatdan o'tkazilmoqda...";


    const { data, error } =
        await supabaseClient.auth.signUp({
            email,
            password
        });


    if (error) {

        message.textContent =
            error.message;

        return;
    }


    message.textContent =
        "Ro'yxatdan o'tish muvaffaqiyatli. Emailingizni tasdiqlang.";

}


// =====================================================
// LOGOUT
// =====================================================

async function logout() {

    await supabaseClient.auth.signOut();

    if (realtimeChannel) {

        await supabaseClient
            .removeChannel(realtimeChannel);

    }

    location.reload();
}


// =====================================================
// START APP
// =====================================================

async function startApp() {

    if (!currentUser) return;


    isAdmin =
        currentUser.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase();


    document.getElementById("loginPage")
        .style.display = "none";


    document.getElementById("app")
        .style.display = "block";


    document.getElementById("userEmail")
        .textContent =
        currentUser.email;


    updateRole();


    createBlocks();


    await showBlock(1);


    startRealtime();

}


// =====================================================
// ROLE
// =====================================================

function updateRole() {

    const badge =
        document.getElementById("roleBadge");

    const notice =
        document.getElementById("notice");


    if (isAdmin) {

        badge.className =
            "admin-badge";

        badge.textContent =
            "ADMIN";

        notice.innerHTML =
            `<div class="notice">
                Siz admin sifatida kirdingiz.
                Ma'lumotlarni o'zgartirishingiz mumkin.
            </div>`;

    } else {

        badge.className =
            "viewer-badge";

        badge.textContent =
            "KO'RUVCHI";

        notice.innerHTML =
            `<div class="notice">
                Siz faqat ma'lumotlarni ko'rishingiz mumkin.
            </div>`;

    }

}


// =====================================================
// CREATE BLOCKS
// =====================================================

function createBlocks() {

    const container =
        document.getElementById("blocks");

    container.innerHTML = "";


    for (let i = 1; i <= 17; i++) {

        const button =
            document.createElement("button");

        button.className =
            "block-button";

        button.textContent =
            i + "-blok";


        button.onclick =
            () => showBlock(i);


        button.dataset.block =
            i;


        container.appendChild(button);

    }

}


// =====================================================
// ACTIVE BLOCK
// =====================================================

function setActiveBlock(blockNumber) {

    document
        .querySelectorAll(".block-button")
        .forEach(button => {

            button.classList.remove("active");

            if (
                Number(button.dataset.block) ===
                blockNumber
            ) {

                button.classList.add("active");

            }

        });

}


// =====================================================
// SHOW BLOCK
// =====================================================

async function showBlock(blockNumber) {

    currentBlock =
        blockNumber;


    setActiveBlock(blockNumber);


    document.getElementById("blockTitle")
        .textContent =
        blockNumber + "-blok";


    const container =
        document.getElementById("workList");


    container.innerHTML =
        `<div class="loading">
            Yuklanmoqda...
        </div>`;


    const { data, error } =
        await supabaseClient
            .from("construction_items")
            .select("*")
            .eq("block_id", blockNumber)
            .order("id", { ascending: true });


    if (error) {

        container.innerHTML =
            `<div class="empty">
                Xatolik: ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            `<div class="empty">
                ${blockNumber}-blokda ishlar mavjud emas.
            </div>`;

        document.getElementById("average")
            .textContent = "0%";

        return;
    }


    renderTable(data);

}


// =====================================================
// RENDER TABLE
// =====================================================

function renderTable(items) {

    const container =
        document.getElementById("workList");


    // 17-BLOKDA
    // KO'RUVCHIGA MATERIAL VA BIRLIK KO'RINMAYDI

    const hide17Columns =
        currentBlock === 17 && !isAdmin;


    let html = `
        <table>

            <thead>

                <tr>

                    <th>#</th>

                    ${
                        !hide17Columns
                        ? "<th>Material / uskuna</th>"
                        : ""
                    }

                    <th>Reja</th>

                    <th>Sarflangan</th>

                    ${
                        !hide17Columns
                        ? "<th>Birlik</th>"
                        : ""
                    }

                    <th>1 birlik narxi</th>

                    <th>Jami summa</th>

                    <th>Foiz</th>

                    <th>Status</th>

                    ${
                        isAdmin
                        ? "<th>Saqlash</th>"
                        : ""
                    }

                </tr>

            </thead>

            <tbody>
    `;


    let totalPercent = 0;


    items.forEach((item, index) => {

        const planned =
            Number(item.planned) || 0;

        const used =
            Number(item.used) || 0;

        const price =
            Number(item.price) || 0;


        let percent = 0;


        if (planned > 0) {

            percent =
                (used / planned) * 100;

        }


        if (percent > 100) {

            percent = 100;

        }


        if (percent < 0) {

            percent = 0;

        }


        totalPercent += percent;


        const total =
            used * price;


        let status = "";

        let statusClass = "";


        if (percent === 0) {

            status =
                "Boshlanmagan";

            statusClass =
                "not-started";

        }

        else if (percent >= 100) {

            status =
                "✓ Tugagan";

            statusClass =
                "done";

        }

        else {

            status =
                "Jarayonda";

            statusClass =
                "process";

        }


        html += `
            <tr>

                <td>
                    ${index + 1}
                </td>
        `;


        if (!hide17Columns) {

            html += `

                <td>

                    ${
                        isAdmin
                        ? `
                            <input
                                class="edit-input"
                                id="material-${item.id}"
                                value="${escapeAttribute(item.material || item.name || "")}"
                            >
                          `
                        : `
                            <div class="task-name">
                                ${escapeHtml(item.name || "")}
                            </div>

                            ${
                                item.material
                                ? `
                                    <div class="material-name">
                                        ${escapeHtml(item.material)}
                                    </div>
                                  `
                                : ""
                            }
                          `
                    }

                </td>

            `;

        }


        html += `

            <td>

                ${
                    isAdmin
                    ? `
                        <input
                            class="edit-input"
                            type="number"
                            min="0"
                            id="planned-${item.id}"
                            value="${planned}"
                        >
                      `
                    : formatNumber(planned)
                }

            </td>


            <td>

                ${
                    isAdmin
                    ? `
                        <input
                            class="edit-input"
                            type="number"
                            min="0"
                            id="used-${item.id}"
                            value="${used}"
                            oninput="updatePreview(${item.id}, ${price})"
                        >
                      `
                    : formatNumber(used)
                }

            </td>
        `;


        if (!hide17Columns) {

            html += `

                <td>

                    ${
                        isAdmin
                        ? `
                            <input
                                class="edit-input"
                                id="unit-${item.id}"
                                value="${escapeAttribute(item.unit || "")}"
                            >
                          `
                        : escapeHtml(item.unit || "")
                    }

                </td>

            `;

        }


        html += `

            <td>

                ${
                    isAdmin
                    ? `
                        <input
                            class="edit-input"
                            type="number"
                            min="0"
                            id="price-${item.id}"
                            value="${price}"
                        >
                      `
                    : formatNumber(price)
                }

            </td>


            <td id="total-${item.id}">

                ${formatMoney(total)}

            </td>


            <td>

                <div class="progress-container">

                    <div class="progress-bar">

                        <div
                            id="bar-${item.id}"
                            class="progress-fill"
                            style="width:${percent}%"
                        ></div>

                    </div>

                    <div
                        id="percent-${item.id}"
                        class="progress-text"
                    >
                        ${percent.toFixed(1)}%
                    </div>

                </div>

            </td>


            <td>

                <span
                    id="status-${item.id}"
                    class="status ${statusClass}"
                >
                    ${status}
                </span>

            </td>
        `;


        if (isAdmin) {

            html += `

                <td>

                    <button
                        class="save-btn"
                        onclick="saveItem(${item.id})"
                    >
                        Saqlash
                    </button>

                </td>

            `;

        }


        html += `
            </tr>
        `;

    });


    html += `
            </tbody>

        </table>
    `;


    container.innerHTML =
        html;


    const average =
        items.length
        ? totalPercent / items.length
        : 0;


    document.getElementById("average")
        .textContent =
        average.toFixed(1) + "%";

}


// =====================================================
// UPDATE PREVIEW
// =====================================================

function updatePreview(id, price) {

    const usedInput =
        document.getElementById(
            "used-" + id
        );


    const plannedInput =
        document.getElementById(
            "planned-" + id
        );


    const priceInput =
        document.getElementById(
            "price-" + id
        );


    if (!usedInput) return;


    const used =
        Number(usedInput.value) || 0;


    const planned =
        plannedInput
        ? Number(plannedInput.value) || 0
        : 0;


    const currentPrice =
        priceInput
        ? Number(priceInput.value) || 0
        : price;


    let percent =
        planned > 0
        ? (used / planned) * 100
        : 0;


    if (percent > 100)
        percent = 100;


    if (percent < 0)
        percent = 0;


    const total =
        used * currentPrice;


    const percentElement =
        document.getElementById(
            "percent-" + id
        );


    const barElement =
        document.getElementById(
            "bar-" + id
        );


    const totalElement =
        document.getElementById(
            "total-" + id
        );


    const statusElement =
        document.getElementById(
            "status-" + id
        );


    if (percentElement) {

        percentElement.textContent =
            percent.toFixed(1) + "%";

    }


    if (barElement) {

        barElement.style.width =
            percent + "%";

    }


    if (totalElement) {

        totalElement.textContent =
            formatMoney(total);

    }


    if (statusElement) {

        if (percent === 0) {

            statusElement.textContent =
                "Boshlanmagan";

            statusElement.className =
                "status not-started";

        }

        else if (percent >= 100) {

            statusElement.textContent =
                "✓ Tugagan";

            statusElement.className =
                "status done";

        }

        else {

            statusElement.textContent =
                "Jarayonda";

            statusElement.className =
                "status process";

        }

    }

}


// =====================================================
// SAVE ITEM
// =====================================================

async function saveItem(id) {

    if (!isAdmin) {

        alert(
            "Sizda ma'lumotlarni o'zgartirish huquqi yo'q."
        );

        return;
    }


    const materialInput =
        document.getElementById(
            "material-" + id
        );


    const plannedInput =
        document.getElementById(
            "planned-" + id
        );


    const usedInput =
        document.getElementById(
            "used-" + id
        );


    const unitInput =
        document.getElementById(
            "unit-" + id
        );


    const priceInput =
        document.getElementById(
            "price-" + id
        );


    const updateData = {

        planned:
            Number(plannedInput?.value) || 0,

        used:
            Number(usedInput?.value) || 0,

        price:
            Number(priceInput?.value) || 0

    };


    if (materialInput) {

        updateData.material =
            materialInput.value;

    }


    if (unitInput) {

        updateData.unit =
            unitInput.value;

    }


    const { error } =
        await supabaseClient
            .from("construction_items")
            .update(updateData)
            .eq("id", id);


    if (error) {

        alert(
            "Saqlashda xatolik:\n" +
            error.message
        );

        return;
    }


    alert(
        "Ma'lumot saqlandi ✅"
    );


    await showBlock(currentBlock);

}


// =====================================================
// REALTIME
// =====================================================

function startRealtime() {

    realtimeChannel =
        supabaseClient
            .channel("construction-items-live")

            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "construction_items"
                },
                () => {

                    showBlock(currentBlock);

                }
            )

            .subscribe();

}


// =====================================================
// FORMAT NUMBER
// =====================================================

function formatNumber(number) {

    return Number(number || 0)
        .toLocaleString("uz-UZ");

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(number) {

    return Number(number || 0)
        .toLocaleString("uz-UZ") +
        " so'm";

}


// =====================================================
// SECURITY HTML
// =====================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}


// =====================================================
// CHECK EXISTING SESSION
// =====================================================

async function checkSession() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if (data.session) {

        currentUser =
            data.session.user;

        await startApp();

    }

}


checkSession();


// =====================================================
// AUTH STATE
// =====================================================

supabaseClient.auth
    .onAuthStateChange(
        async (event, session) => {

            if (
                event === "SIGNED_IN" &&
                session
            ) {

                currentUser =
                    session.user;

                await startApp();

            }

        }
    );
